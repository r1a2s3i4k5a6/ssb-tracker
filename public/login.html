<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Selection Board | Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <section class="auth-art">
    <svg class="compass" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="56" fill="none" stroke="#e0a93f" stroke-width="1.2"/>
      <circle cx="60" cy="60" r="46" fill="none" stroke="#26374f" stroke-width="1" stroke-dasharray="2 5"/>
      <g fill="#93a3ba" font-size="9" font-family="Barlow Condensed" text-anchor="middle">
        <text x="60" y="13">N</text><text x="60" y="113">S</text>
        <text x="108" y="63">E</text><text x="12" y="63">W</text>
      </g>
      <g class="needle">
        <path d="M60 22 L67 60 L53 60Z" fill="#b0443d"/>
        <path d="M60 98 L67 60 L53 60Z" fill="#dfe6f1"/>
      </g>
      <circle cx="60" cy="60" r="3.5" fill="#e0a93f"/>
    </svg>
    <h1>Train every day.<br>Walk into SSB ready.</h1>
    <p>Plan your day, track your tasks and build a streak that keeps you consistent until your board date.</p>
  </section>

  <section class="auth-box">
    <div class="switch">
      <button type="button" class="on" data-t="login">Sign in</button>
      <button type="button" data-t="register">Create account</button>
    </div>

    <form id="loginForm">
      <label>Email<input type="email" id="lEmail" required autocomplete="email"></label>
      <label>Password<input type="password" id="lPass" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Sign in</button>
    </form>

    <form id="registerForm" hidden>
      <label>Full name<input type="text" id="rName" required autocomplete="name"></label>
      <label>Email<input type="email" id="rEmail" required autocomplete="email"></label>
      <label>Password (min 6 characters)<input type="password" id="rPass" minlength="6" required autocomplete="new-password"></label>
      <div class="two">
        <label>Entry
          <select id="rEntry">
            <option>NDA</option><option>CDS</option><option>AFCAT</option><option>TES</option><option>NCC Special</option>
          </select>
        </label>
        <label>SSB date (optional)<input type="date" id="rDate"></label>
      </div>
      <button class="btn" type="submit">Create account</button>
    </form>

    <p id="msg" class="msg" role="alert"></p>
    <button class="demo" id="demoBtn" type="button">Try the demo account (demo@ssb.com)</button>
    <p class="mini" style="margin-top:8px"><a href="index.html" style="color:var(--mute)">&larr; Back to home</a></p>
  </section>

  <script src="js/login.js"></script>
</body>
</html>
